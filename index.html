<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD · Price Action</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
    background: #05070c;
    color: #e0e6ed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Liquid ambient background */
  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #f0b90b 0%, transparent 70%);
    top: -80px; left: -100px;
    animation: float1 18s ease-in-out infinite;
  }
  body::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #1e5aa8 0%, transparent 70%);
    bottom: -120px; right: -120px;
    animation: float2 22s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(80px, 60px) scale(1.15); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-70px, -50px) scale(1.1); }
  }

  /* Glass card */
  .card {
    position: relative;
    z-index: 1;
    background: rgba(19, 26, 38, 0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    padding: 26px 22px;
    max-width: 460px;
    width: 100%;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.06),
      0 0 0 1px rgba(255, 255, 255, 0.02);
    overflow: hidden;
  }
  /* Top sheen on glass */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent, rgba(255,255,255,0.35), transparent);
  }

  h1 {
    font-size: 13px;
    font-weight: 600;
    color: #a8b4c8;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 0 12px rgba(240,185,11,0.15);
  }
  .subtitle {
    font-size: 11px;
    color: #6b7a8f;
    margin-bottom: 18px;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .price {
    font-size: 40px;
    font-weight: 700;
    color: #f0b90b;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-shadow:
      0 0 20px rgba(240, 185, 11, 0.45),
      0 0 40px rgba(240, 185, 11, 0.15);
  }
  .change {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .change.up   { color: #2ebd59; text-shadow: 0 0 12px rgba(46,189,89,0.4); }
  .change.down { color: #e05252; text-shadow: 0 0 12px rgba(224,82,82,0.4); }

  .unit {
    font-size: 11px;
    color: #5a6a80;
    margin-bottom: 16px;
  }

  /* Signal box — glassy */
  .signal-box {
    position: relative;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.4s ease;
  }
  .signal-buy {
    background: linear-gradient(135deg, rgba(46,189,89,0.18), rgba(46,189,89,0.04));
    border-color: rgba(46,189,89,0.35);
    box-shadow: 0 0 24px rgba(46,189,89,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .signal-sell {
    background: linear-gradient(135deg, rgba(224,82,82,0.18), rgba(224,82,82,0.04));
    border-color: rgba(224,82,82,0.35);
    box-shadow: 0 0 24px rgba(224,82,82,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .signal-watch {
    background: linear-gradient(135deg, rgba(240,185,11,0.16), rgba(240,185,11,0.03));
    border-color: rgba(240,185,11,0.3);
    box-shadow: 0 0 24px rgba(240,185,11,0.12), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .signal-wait {
    background: linear-gradient(135deg, rgba(139,155,180,0.10), rgba(139,155,180,0.02));
    border-color: rgba(139,155,180,0.2);
  }
  .signal-label {
    font-size: 10px;
    letter-spacing: 1.4px;
    color: #8b9bb4;
    margin-bottom: 4px;
  }
  .signal-action {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
  }
  .signal-buy   .signal-action { color: #2ebd59; text-shadow: 0 0 14px rgba(46,189,89,0.5); }
  .signal-sell  .signal-action { color: #e05252; text-shadow: 0 0 14px rgba(224,82,82,0.5); }
  .signal-watch .signal-action { color: #f0b90b; text-shadow: 0 0 14px rgba(240,185,11,0.5); }
  .signal-wait  .signal-action { color: #8b9bb4; }
  .signal-reason {
    font-size: 11.5px;
    color: #a8b4c8;
    line-height: 1.5;
  }

  .section-title {
    font-size: 10px;
    letter-spacing: 1.4px;
    color: #6b7a8f;
    text-transform: uppercase;
    margin: 14px 0 8px;
  }

  .zone-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 13px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 9px;
    margin-bottom: 6px;
    font-size: 12px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .zone-label { color: #7a8a9a; }
  .zone-value {
    color: #c0ccda;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .zone-value.bull { color: #2ebd59; text-shadow: 0 0 10px rgba(46,189,89,0.35); }
  .zone-value.bear { color: #e05252; text-shadow: 0 0 10px rgba(224,82,82,0.35); }

  .pa-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .tag {
    font-size: 10px;
    padding: 4px 9px;
    border-radius: 6px;
    letter-spacing: 0.5px;
    font-weight: 600;
    border: 1px solid transparent;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .tag.bull {
    background: rgba(46,189,89,0.14);
    color: #2ebd59;
    border-color: rgba(46,189,89,0.28);
  }
  .tag.bear {
    background: rgba(224,82,82,0.14);
    color: #e05252;
    border-color: rgba(224,82,82,0.28);
  }
  .tag.neutral {
    background: rgba(139,155,180,0.1);
    color: #8b9bb4;
    border-color: rgba(139,155,180,0.2);
  }

  #watchFor {
    padding: 11px 13px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 9px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .footer {
    margin-top: 16px;
    font-size: 10px;
    color: #5a6a80;
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <h1>XAUUSD · Price Action</h1>
  <div class="subtitle">Forward-looking signals from candlestick structure</div>

  <div class="price-row">
    <div class="price" id="price">—</div>
    <div class="change" id="change">—</div>
  </div>
  <div class="unit">USD per troy ounce</div>

  <div class="signal-box signal-wait" id="signalBox">
    <div class="signal-label">SIGNAL</div>
    <div class="signal-action" id="signalAction">LOADING</div>
    <div class="signal-reason" id="signalReason">Analyzing price action…</div>
  </div>

  <div class="section-title">Price Action Reads</div>
  <div class="pa-tags" id="paTags">
    <span class="tag neutral">Analyzing…</span>
  </div>

  <div class="section-title">Key Levels</div>
  <div class="zone-row">
    <span class="zone-label">Resistance (24h)</span>
    <span class="zone-value bear" id="res">—</span>
  </div>
  <div class="zone-row">
    <span class="zone-label">Support (24h)</span>
    <span class="zone-value bull" id="sup">—</span>
  </div>
  <div class="zone-row">
    <span class="zone-label">Trigger Buy Above</span>
    <span class="zone-value bull" id="trigBuy">—</span>
  </div>
  <div class="zone-row">
    <span class="zone-label">Trigger Sell Below</span>
    <span class="zone-value bear" id="trigSell">—</span>
  </div>

  <div class="section-title">Watch For</div>
  <div class="signal-reason" id="watchFor">
    Waiting for data…
  </div>

  <div class="footer" id="updated">Fetching…</div>
</div>

<script>
const fmt = n => (n == null || isNaN(n)) ? '—' :
  Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

async function fetchSpot() {
  const res = await fetch('https://xaus.com/api/v1/spot?compact=1');
  if (!res.ok) throw new Error('Spot ' + res.status);
  const d = await res.json();
  const price = d.spot_usd_oz || d.price || d.spot || d.last;
  if (!price) throw new Error('No price');
  return {
    price: Number(price),
    high: Number(d.high_24h || d.high || price),
    low:  Number(d.low_24h  || d.low  || price),
    open: Number(d.open_24h || d.open || price)
  };
}

async function fetchDaily() {
  const res = await fetch('https://stooq.com/q/d/l/?s=xauusd&i=d');
  if (!res.ok) throw new Error('Daily ' + res.status);
  const lines = (await res.text()).trim().split('\n').slice(1);
  return lines.map(l => {
    const [date, o, h, l, c] = l.split(',');
    return { date, open: +o, high: +h, low: +l, close: +c };
  }).filter(c => !isNaN(c.high) && !isNaN(c.low));
}

async function fetchHourly() {
  const res = await fetch('https://stooq.com/q/d/l/?s=xauusd&i=h');
  if (!res.ok) throw new Error('Hourly ' + res.status);
  const lines = (await res.text()).trim().split('\n').slice(1);
  return lines.map(l => {
    const parts = l.split(',');
    return {
      date: parts[0] + ' ' + parts[1],
      open: +parts[2], high: +parts[3], low: +parts[4], close: +parts[5]
    };
  }).filter(c => !isNaN(c.high) && !isNaN(c.low)).slice(-50);
}

function analyzePriceAction(hourly, daily, spot) {
  const reads = [];
  let score = 0;

  if (hourly.length < 5) return { reads, score };

  const last = hourly[hourly.length - 1];
  const prev = hourly[hourly.length - 2];

  const body = Math.abs(last.close - last.open);
  const range = last.high - last.low;
  const upperWick = last.high - Math.max(last.open, last.close);
  const lowerWick = Math.min(last.open, last.close) - last.low;

  if (range > 0) {
    if (lowerWick > body * 2 && upperWick < body * 0.5) {
      reads.push({ label: 'Hammer (bullish)', type: 'bull' }); score += 2;
    }
    if (upperWick > body * 2 && lowerWick < body * 0.5) {
      reads.push({ label: 'Shooting Star (bearish)', type: 'bear' }); score -= 2;
    }
    const prevBody = Math.abs(prev.close - prev.open);
    const prevBull = prev.close > prev.open;
    const lastBull = last.close > last.open;
    if (body > prevBody * 1.5 && prevBull !== lastBull) {
      if (lastBull) { reads.push({ label: 'Bullish Engulfing', type: 'bull' }); score += 2; }
      else          { reads.push({ label: 'Bearish Engulfing', type: 'bear' }); score -= 2; }
    }
  }

  const recent = hourly.slice(-10);
  const highs = recent.map(c => c.high);
  const lows  = recent.map(c => c.low);
  const mid = Math.floor(recent.length / 2);
  const hhUp = Math.max(...highs.slice(mid)) > Math.max(...highs.slice(0, mid));
  const hlUp = Math.min(...lows.slice(mid))  > Math.min(...lows.slice(0, mid));
  const lhDn = Math.max(...highs.slice(mid)) < Math.max(...highs.slice(0, mid));
  const llDn = Math.min(...lows.slice(mid))  < Math.min(...lows.slice(0, mid));

  if (hhUp && hlUp) { reads.push({ label: 'HH + HL (uptrend)', type: 'bull' }); score += 1; }
  else if (lhDn && llDn) { reads.push({ label: 'LH + LL (downtrend)', type: 'bear' }); score -= 1; }
  else { reads.push({ label: 'Range / chop', type: 'neutral' }); }

  const closes = hourly.slice(-4).map(c => c.close);
  const momentum = closes[3] - closes[0];
  if (momentum > 0.5) { reads.push({ label: 'Momentum up', type: 'bull' }); score += 1; }
  else if (momentum < -0.5) { reads.push({ label: 'Momentum down', type: 'bear' }); score -= 1; }

  const pd = daily[daily.length - 2];
  if (pd) {
    const pos = (spot.price - pd.low) / (pd.high - pd.low);
    if (pos > 0.85) { reads.push({ label: 'Near PDH (sweep risk)', type: 'bear' }); score -= 1; }
    else if (pos < 0.15) { reads.push({ label: 'Near PDL (sweep risk)', type: 'bull' }); score += 1; }
  }

  if (range > 0 && upperWick > range * 0.6) { reads.push({ label: 'Upper wick rejection', type: 'bear' }); score -= 1; }
  if (range > 0 && lowerWick > range * 0.6) { reads.push({ label: 'Lower wick rejection', type: 'bull' }); score += 1; }

  return { reads, score, last };
}

function render(spot, daily, hourly) {
  const price = spot.price;
  const change = price - spot.open;
  const changePct = spot.open ? (change / spot.open) * 100 : 0;

  document.getElementById('price').textContent = fmt(price);
  const changeEl = document.getElementById('change');
  changeEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) +
    ' (' + (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%)';
  changeEl.className = 'change ' + (change >= 0 ? 'up' : 'down');

  const pa = analyzePriceAction(hourly, daily, spot);

  const tagsEl = document.getElementById('paTags');
  tagsEl.innerHTML = pa.reads.length
    ? pa.reads.map(r => `<span class="tag ${r.type}">${r.label}</span>`).join('')
    : '<span class="tag neutral">No patterns</span>';

  let signalType, signalAction, signalReason;
  if (pa.score >= 3) {
    signalType = 'buy'; signalAction = 'BUY BIAS';
    signalReason = 'Bullish confluence: ' + pa.score + ' price-action factors align. Watch for entry on pullback into support.';
  } else if (pa.score <= -3) {
    signalType = 'sell'; signalAction = 'SELL BIAS';
    signalReason = 'Bearish confluence: ' + Math.abs(pa.score) + ' price-action factors align. Watch for entry on retest of resistance.';
  } else if (pa.score >= 1) {
    signalType = 'watch'; signalAction = 'WATCH LONG';
    signalReason = 'Mild bullish lean. Wait for a clean break of the trigger level above before entering.';
  } else if (pa.score <= -1) {
    signalType = 'watch'; signalAction = 'WATCH SHORT';
    signalReason = 'Mild bearish lean. Wait for a clean break of the trigger level below before entering.';
  } else {
    signalType = 'wait'; signalAction = 'WAIT';
    signalReason = 'Mixed signals. No clear edge — stay out until structure resolves.';
  }

  const box = document.getElementById('signalBox');
  box.className = 'signal-box signal-' + signalType;
  document.getElementById('signalAction').textContent = signalAction;
  document.getElementById('signalReason').textContent = signalReason;

  const res = spot.high;
  const sup = spot.low;
  document.getElementById('res').textContent = fmt(res);
  document.getElementById('sup').textContent = fmt(sup);

  const atr = computeATR(hourly.slice(-14));
  const trigBuy  = res + atr * 0.2;
  const trigSell = sup - atr * 0.2;
  document.getElementById('trigBuy').textContent  = fmt(trigBuy);
  document.getElementById('trigSell').textContent = fmt(trigSell);

  let watch;
  if (signalType === 'buy') {
    watch = `Watch for price to hold above ${fmt(sup)} and break ${fmt(trigBuy)} with a strong close. A retest of ${fmt(sup)} that holds is a quality long entry.`;
  } else if (signalType === 'sell') {
    watch = `Watch for price to reject ${fmt(res)} and break below ${fmt(trigSell)} with a strong close. A retest of ${fmt(res)} that fails is a quality short entry.`;
  } else {
    watch = `Price is between ${fmt(sup)} and ${fmt(res)}. A confirmed break of either side with momentum gives the next trade. Don't force it in the middle.`;
  }
  document.getElementById('watchFor').textContent = watch;

  document.getElementById('updated').textContent =
    'Updated ' + new Date().toLocaleTimeString() + ' · 60s refresh';
}

function computeATR(candles) {
  if (candles.length < 2) return 1;
  let sum = 0;
  for (let i = 1; i < candles.length; i++) {
    const tr = Math.max(
      candles[i].high - candles[i].low,
      Math.abs(candles[i].high - candles[i-1].close),
      Math.abs(candles[i].low  - candles[i-1].close)
    );
    sum += tr;
  }
  return sum / (candles.length - 1);
}

async function refresh() {
  try {
    const [spot, daily, hourly] = await Promise.all([
      fetchSpot(),
      fetchDaily(),
      fetchHourly()
    ]);
    render(spot, daily, hourly);
  } catch (err) {
    document.getElementById('updated').textContent = '⚠ ' + err.message;
    document.getElementById('signalReason').textContent = err.message;
  }
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
  </html>
