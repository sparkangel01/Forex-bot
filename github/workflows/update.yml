# .github/workflows/update.yml
name: Update Gold SMC Signals

on:
  schedule:
    # Runs every hour at the top of the hour (UTC).
    # GitHub's minimum interval for schedule is 5 minutes.
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  update-signal:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the updated signals.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas smart-money-concept

      - name: Run SMC analysis
        run: python generate_signals.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add signals.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update gold signals [skip ci]" && git push)
